1<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Sharma Sir's Digital Lab</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .brand {
      text-align: center;
      margin: 24px 0 20px;
    }
    .brand img {
      width: 64px; height: 64px; border-radius: 50%;
      object-fit: cover; margin-bottom: 8px;
    }
    .brand h2 { color: #1a237e; font-size: 1.1rem; }
    .brand p { color: #555; font-size: 0.82rem; }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%; max-width: 420px;
      overflow: hidden;
    }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
    }
    .tab-btn {
      flex: 1; padding: 14px;
      border: none; background: #f7f7f7;
      font-size: 0.95rem; cursor: pointer;
      color: #666; font-weight: 600;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #fff; color: #1a237e;
      border-bottom: 3px solid #ff6f00;
    }

    .tab-panel { display: none; padding: 28px 24px 24px; }
    .tab-panel.active { display: block; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.83rem; color: #444; margin-bottom: 5px; font-weight: 600; }
    input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 1rem; outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #1a237e; }

    .btn {
      width: 100%; padding: 13px;
      border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
      margin-top: 4px;
    }
    .btn-primary { background: #ff6f00; color: #fff; }
    .btn-primary:hover { background: #e65100; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: #1a237e; color: #fff; }
    .btn-secondary:hover { background: #0d1461; }
    .btn-outline {
      background: #fff; color: #333;
      border: 1.5px solid #ddd;
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
    }
    .btn-outline:hover { background: #f5f5f5; }
    .btn-outline img { width: 20px; height: 20px; }

    .or-divider {
      text-align: center; margin: 16px 0;
      color: #999; font-size: 0.85rem;
      position: relative;
    }
    .or-divider::before, .or-divider::after {
      content: ''; position: absolute; top: 50%;
      width: 42%; height: 1px; background: #e0e0e0;
    }
    .or-divider::before { left: 0; }
    .or-divider::after { right: 0; }

    .otp-row { display: flex; gap: 8px; }
    .otp-row input { flex: 1; text-align: center; font-size: 1.2rem; letter-spacing: 4px; }
    .otp-row .btn { flex-shrink: 0; width: auto; padding: 12px 14px; font-size: 0.85rem; }

    .msg {
      margin-top: 12px; padding: 10px 14px;
      border-radius: 8px; font-size: 0.88rem;
      display: none;
    }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.error { background: #ffebee; color: #c62828; display: block; }
    .msg.info { background: #e3f2fd; color: #1565c0; display: block; }

    .switch-link {
      text-align: center; margin-top: 16px;
      font-size: 0.85rem; color: #555;
    }
    .switch-link a { color: #ff6f00; font-weight: 700; text-decoration: none; }

    .recaptcha-note {
      font-size: 0.75rem; color: #999; text-align: center;
      margin-top: 10px;
    }

    #recaptcha-container { margin: 8px 0; }

    .timer { font-size: 0.82rem; color: #888; text-align: center; margin-top: 6px; }

    .back-link {
      margin-top: 24px; font-size: 0.88rem;
      color: #1a237e; text-decoration: none;
      display: flex; align-items: center; gap: 5px;
    }
    .back-link:hover { text-decoration: underline; }

    .loading-spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="brand">
  <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'" />
  <h2>Sharma Sir's Digital Lab</h2>
  <p>RPSC · SSC · REET · Railway</p>
</div>

<div class="card">
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('email')">📧 Email Login</button>
    <button class="tab-btn" onclick="switchTab('otp')">📱 OTP Login</button>
  </div>

  <!-- EMAIL TAB -->
  <div class="tab-panel active" id="tab-email">
    <button class="btn btn-outline" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G" />
      Google से Login करें
    </button>

    <div class="or-divider">या</div>

    <div class="form-group">
      <label>आपका नाम</label>
      <input type="text" id="email-name" placeholder="पूरा नाम दर्ज करें" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email-input" placeholder="example@gmail.com" />
    </div>
    <div class="form-group">
      <label>Password (कम से कम 6 अक्षर)</label>
      <input type="password" id="email-password" placeholder="••••••••" />
    </div>

    <button class="btn btn-primary" onclick="emailLogin()">Login करें</button>

    <div class="msg" id="email-msg"></div>

    <div class="switch-link">
      अकाउंट नहीं है? <a href="#" onclick="emailSignup()">अभी Sign Up करें</a>
    </div>
  </div>

  <!-- OTP TAB -->
  <div class="tab-panel" id="tab-otp">
    <div id="otp-step1">
      <div class="form-group">
        <label>मोबाइल नंबर (10 अंक)</label>
        <div style="display:flex;gap:8px;">
          <input type="text" value="+91" style="width:60px;text-align:center;flex-shrink:0;" readonly />
          <input type="tel" id="otp-phone" placeholder="9876543210" maxlength="10" style="flex:1;" />
        </div>
      </div>
      <div id="recaptcha-container"></div>
      <button class="btn btn-primary" id="send-otp-btn" onclick="sendOTP()">📩 OTP भेजें</button>
      <div class="recaptcha-note">reCAPTCHA द्वारा सुरक्षित</div>
    </div>

    <div id="otp-step2" style="display:none;">
      <div class="form-group">
        <label>OTP डालें (6 अंक)</label>
        <div class="otp-row">
          <input type="tel" id="otp-code" placeholder="------" maxlength="6" />
          <button class="btn btn-secondary" onclick="verifyOTP()">✅ Verify</button>
        </div>
      </div>
      <div class="timer" id="otp-timer"></div>
      <div style="text-align:center;margin-top:12px;">
        <a href="#" onclick="resendOTP()" style="color:#ff6f00;font-size:0.85rem;font-weight:600;">🔁 दोबारा OTP भेजें</a>
      </div>
    </div>

    <div class="msg" id="otp-msg"></div>
  </div>
</div>

<a href="index.html" class="back-link">← Website पर वापस जाएं</a>

<!-- Firebase v9 Compat (works everywhere including mobile) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // ── IMPORTANT: Replace with your actual Firebase config ──
  const firebaseConfig = {
  apiKey: "AIzaSyC0KSUHxzJPsk29ETOgojpH6rc003fBLII",
  authDomain: "sharma-sir-digital-lab-df5c4.firebaseapp.com",
  projectId: "sharma-sir-digital-lab-df5c4",
  storageBucket: "sharma-sir-digital-lab-df5c4.firebasestorage.app",
  messagingSenderId: "1055829277012",
  appId: "1:1055829277012:web:6c9f283c094972fd1b30c1"
};

  // Check if config is placeholder
  const isConfigured = !firebaseConfig.apiKey.includes("YOUR_API_KEY");

  let app, auth, recaptchaVerifier, confirmationResult;
  let timerInterval;

  if (isConfigured) {
    app = firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    auth.languageCode = 'hi';
    initRecaptcha();
  }

  function initRecaptcha() {
    try {
      recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        size: 'invisible',   // ← invisible reCAPTCHA works on mobile
        callback: () => {},
        'expired-callback': () => {
          showMsg('otp-msg', 'reCAPTCHA expire हो गया, दोबारा कोशिश करें।', 'error');
          recaptchaVerifier.clear();
          initRecaptcha();
        }
      });
      recaptchaVerifier.render();
    } catch(e) {
      console.error('reCAPTCHA init error:', e);
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    if (tab === 'email') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-email').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-otp').classList.add('active');
    }
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  function hideMsg(id) {
    document.getElementById(id).className = 'msg';
  }

  async function sendOTP() {
    const phone = document.getElementById('otp-phone').value.trim();
    if (!/^\d{10}$/.test(phone)) {
      showMsg('otp-msg', '❌ 10 अंकों का सही मोबाइल नंबर दर्ज करें।', 'error');
      return;
    }

    if (!isConfigured) {
      showMsg('otp-msg', '⚠️ Firebase config सेट नहीं है। Admin से संपर्क करें।', 'error');
      return;
    }

    const btn = document.getElementById('send-otp-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span>OTP भेज रहे हैं...';
    hideMsg('otp-msg');

    try {
      const fullPhone = '+91' + phone;
      confirmationResult = await auth.signInWithPhoneNumber(fullPhone, recaptchaVerifier);
      showMsg('otp-msg', '✅ OTP भेज दिया गया! अपने फोन पर देखें।', 'success');
      document.getElementById('otp-step1').style.display = 'none';
      document.getElementById('otp-step2').style.display = 'block';
      startTimer(120);
    } catch (err) {
      console.error(err);
      let msg = '❌ OTP भेजने में समस्या हुई।';
      if (err.code === 'auth/invalid-phone-number') msg = '❌ नंबर गलत है। दोबारा जाँचें।';
      if (err.code === 'auth/too-many-requests') msg = '❌ बहुत अधिक प्रयास। थोड़ी देर बाद कोशिश करें।';
      if (err.code === 'auth/captcha-check-failed') msg = '❌ reCAPTCHA verify नहीं हुआ। Page reload करें।';
      showMsg('otp-msg', msg, 'error');
      btn.disabled = false;
      btn.textContent = '📩 OTP भेजें';
      recaptchaVerifier.clear();
      initRecaptcha();
    }
  }

  async function verifyOTP() {
    const code = document.getElementById('otp-code').value.trim();
    if (!/^\d{6}$/.test(code)) {
      showMsg('otp-msg', '❌ 6 अंकों का OTP दर्ज करें।', 'error');
      return;
    }
    showMsg('otp-msg', '⏳ Verify हो रहा है...', 'info');
    try {
      const result = await confirmationResult.confirm(code);
      const user = result.user;
      localStorage.setItem('ssdl_user', JSON.stringify({
        uid: user.uid, phone: user.phoneNumber,
        method: 'otp', name: user.displayName || 'Student'
      }));
      showMsg('otp-msg', '✅ Login सफल! Dashboard पर जा रहे हैं...', 'success');
      clearInterval(timerInterval);
      setTimeout(() => window.location.href = 'dashboard.html', 1200);
    } catch (err) {
      let msg = '❌ OTP गलत है या expire हो गया।';
      if (err.code === 'auth/code-expired') msg = '❌ OTP expire हो गया। दोबारा भेजें।';
      showMsg('otp-msg', msg, 'error');
    }
  }

  function resendOTP() {
    clearInterval(timerInterval);
    document.getElementById('otp-step1').style.display = 'block';
    document.getElementById('otp-step2').style.display = 'none';
    document.getElementById('otp-code').value = '';
    document.getElementById('send-otp-btn').disabled = false;
    document.getElementById('send-otp-btn').textContent = '📩 OTP भेजें';
    hideMsg('otp-msg');
    recaptchaVerifier.clear();
    initRecaptcha();
  }

  function startTimer(seconds) {
    let remaining = seconds;
    const el = document.getElementById('otp-timer');
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (remaining <= 0) {
        clearInterval(timerInterval);
        el.textContent = 'OTP expire हो गया। दोबारा भेजें।';
        return;
      }
      el.textContent = `OTP ${remaining} सेकंड में expire होगा`;
      remaining--;
    }, 1000);
  }

  async function googleLogin() {
    if (!isConfigured) {
      showMsg('email-msg', '⚠️ Firebase config सेट नहीं है।', 'error');
      return;
    }
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      const user = result.user;
      localStorage.setItem('ssdl_user', JSON.stringify({
        uid: user.uid, email: user.email,
        name: user.displayName, method: 'google',
        photo: user.photoURL
      }));
      showMsg('email-msg', '✅ Google Login सफल!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    } catch (err) {
      showMsg('email-msg', '❌ Google Login में समस्या। दोबारा कोशिश करें।', 'error');
    }
  }

  async function emailLogin() {
    const email = document.getElementById('email-input').value.trim();
    const password = document.getElementById('email-password').value;
    if (!email || !password) {
      showMsg('email-msg', '❌ Email और Password दर्ज करें।', 'error'); return;
    }
    if (!isConfigured) {
      showMsg('email-msg', '⚠️ Firebase config सेट नहीं है।', 'error'); return;
    }
    showMsg('email-msg', '⏳ Login हो रहा है...', 'info');
    try {
      const result = await auth.signInWithEmailAndPassword(email, password);
      const user = result.user;
      localStorage.setItem('ssdl_user', JSON.stringify({
        uid: user.uid, email: user.email,
        name: user.displayName || 'Student', method: 'email'
      }));
      showMsg('email-msg', '✅ Login सफल!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    } catch (err) {
      let msg = '❌ Login नहीं हो सका।';
      if (err.code === 'auth/user-not-found') msg = '❌ Email registered नहीं है। Sign Up करें।';
      if (err.code === 'auth/wrong-password') msg = '❌ Password गलत है।';
      if (err.code === 'auth/invalid-email') msg = '❌ Email format गलत है।';
      showMsg('email-msg', msg, 'error');
    }
  }

  async function emailSignup() {
    const name = document.getElementById('email-name').value.trim();
    const email = document.getElementById('email-input').value.trim();
    const password = document.getElementById('email-password').value;
    if (!name || !email || !password) {
      showMsg('email-msg', '❌ सभी fields भरें।', 'error'); return;
    }
    if (password.length < 6) {
      showMsg('email-msg', '❌ Password कम से कम 6 अक्षर का होना चाहिए।', 'error'); return;
    }
    if (!isConfigured) {
      showMsg('email-msg', '⚠️ Firebase config सेट नहीं है।', 'error'); return;
    }
    showMsg('email-msg', '⏳ Account बना रहे हैं...', 'info');
    try {
      const result = await auth.createUserWithEmailAndPassword(email, password);
      await result.user.updateProfile({ displayName: name });
      localStorage.setItem('ssdl_user', JSON.stringify({
        uid: result.user.uid, email, name, method: 'email'
      }));
      showMsg('email-msg', '✅ Account बन गया! Dashboard पर जा रहे हैं...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1200);
    } catch (err) {
      let msg = '❌ Account नहीं बन सका।';
      if (err.code === 'auth/email-already-in-use') msg = '❌ Email पहले से registered है। Login करें।';
      showMsg('email-msg', msg, 'error');
    }
  }

  // Auto-redirect if already logged in
  const existingUser = localStorage.getItem('ssdl_user');
  if (existingUser) {
    try {
      JSON.parse(existingUser);
      window.location.href = 'dashboard.html';
    } catch(e) { localStorage.removeItem('ssdl_user'); }
  }
</script>
</body>
</html>
