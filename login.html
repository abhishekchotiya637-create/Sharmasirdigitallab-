<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login | Sharma Sir's Digital Lab</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a237e,#283593);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.brand{text-align:center;margin-bottom:22px}
.brand img{width:70px;height:70px;border-radius:50%;border:3px solid rgba(255,255,255,0.3);object-fit:cover;margin-bottom:10px}
.brand h2{color:#fff;font-size:1.2rem;font-weight:800}
.brand p{color:rgba(255,255,255,0.7);font-size:0.8rem;margin-top:3px}
.card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:400px;overflow:hidden}
.tab-bar{display:flex;border-bottom:2px solid #f0f0f0}
.tab-btn{flex:1;padding:14px 8px;border:none;background:#fafafa;font-size:0.88rem;cursor:pointer;color:#999;font-weight:700;transition:all 0.2s}
.tab-btn.active{background:#fff;color:#1a237e;border-bottom:3px solid #ff6f00}
.panel{display:none;padding:22px 20px 20px}
.panel.active{display:block}
.fg{margin-bottom:13px}
label{display:block;font-size:0.75rem;color:#777;margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
input{width:100%;padding:11px 13px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:0.95rem;outline:none;transition:border 0.2s;background:#fafafa}
input:focus{border-color:#1a237e;background:#fff}
.ph-row{display:flex;gap:8px}
.ph-code{width:56px;text-align:center;flex-shrink:0;font-weight:700;color:#1a237e}
.btn{width:100%;padding:13px;border:none;border-radius:11px;font-size:0.95rem;font-weight:800;cursor:pointer;transition:all 0.2s;margin-top:2px}
.btn-orange{background:linear-gradient(135deg,#ff6f00,#ff8f00);color:#fff}
.btn-orange:hover{opacity:0.9}
.btn-orange:disabled{background:#ccc;cursor:not-allowed}
.btn-google{background:#fff;color:#444;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:13px;padding:12px}
.btn-google:hover{background:#f8f8f8}
.btn-blue{background:linear-gradient(135deg,#1a237e,#283593);color:#fff}
.divider{text-align:center;color:#ccc;font-size:0.8rem;margin:10px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:#eee}
.divider::before{left:0}.divider::after{right:0}
.msg{padding:9px 13px;border-radius:9px;font-size:0.83rem;margin-top:10px;display:none}
.msg.ok{background:#e8f5e9;color:#2e7d32;display:block}
.msg.err{background:#ffebee;color:#c62828;display:block}
.msg.info{background:#e3f2fd;color:#1565c0;display:block}
.switch{text-align:center;margin-top:13px;font-size:0.82rem;color:#999}
.switch a{color:#ff6f00;font-weight:700;text-decoration:none;cursor:pointer}
.otp-boxes{display:flex;gap:7px;justify-content:center;margin-bottom:12px}
.otp-boxes input{width:42px;height:48px;text-align:center;font-size:1.4rem;font-weight:800;padding:0;border-radius:10px;color:#1a237e}
.timer-txt{text-align:center;font-size:0.78rem;color:#aaa;margin-bottom:10px}
.resend{text-align:center;font-size:0.82rem;margin-top:10px}
.resend a{color:#ff6f00;font-weight:700;cursor:pointer;text-decoration:none}
.resend a.off{color:#ccc;pointer-events:none}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.back{color:rgba(255,255,255,0.65);font-size:0.83rem;margin-top:20px;text-decoration:none}
.back:hover{color:#fff}
.note{background:#fff8e1;border:1px solid #ffe082;border-radius:9px;padding:9px 12px;font-size:0.77rem;color:#795548;margin-bottom:12px;line-height:1.5}
</style>
</head>
<body>

<div class="brand">
  <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'"/>
  <h2>Sharma Sir's Digital Lab</h2>
  <p>RPSC &middot; SSC &middot; REET &middot; Railway</p>
</div>

<div class="card">
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('email')">&#128231; Email / Google</button>
    <button class="tab-btn" onclick="switchTab('otp')">&#128241; Mobile OTP</button>
  </div>

  <!-- EMAIL PANEL -->
  <div class="panel active" id="p-email">
    <button class="btn btn-google" onclick="googleLogin()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G"/>
      Google &#2360;&#2375; Login &#2325;&#2352;&#2375;&#2306;
    </button>
    <div class="divider">&#2351;&#2366;</div>
    <div class="fg"><label>&#2344;&#2366;&#2350; (Sign Up &#2325;&#2375; &#2354;&#2367;&#2319;)</label><input id="e-name" type="text" placeholder="&#2346;&#2370;&#2352;&#2366; &#2344;&#2366;&#2350;"/></div>
    <div class="fg"><label>Email</label><input id="e-email" type="email" placeholder="example@gmail.com"/></div>
    <div class="fg"><label>Password (6+ &#2309;&#2325;&#2381;&#2359;&#2352;)</label><input id="e-pass" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"/></div>
    <button class="btn btn-orange" onclick="emailLogin()">Login &#2325;&#2352;&#2375;&#2306;</button>
    <div class="msg" id="e-msg"></div>
    <div class="switch">&#2309;&#2325;&#2366;&#2313;&#2306;&#2335; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;? <a onclick="emailSignup()">Sign Up &#2325;&#2352;&#2375;&#2306;</a></div>
  </div>

  <!-- OTP PANEL -->
  <div class="panel" id="p-otp">
    <div id="otp-s1">
      <div class="note">&#128204; OTP &#2310;&#2346;&#2325;&#2375; mobile &#2346;&#2352; SMS &#2310;&#2319;&#2327;&#2366;&#2404;</div>
      <div class="fg">
        <label>Mobile Number</label>
        <div class="ph-row">
          <input class="ph-code" value="+91" readonly/>
          <input id="otp-phone" type="tel" placeholder="9876543210" maxlength="10" style="flex:1"/>
        </div>
      </div>
      <div class="fg"><label>&#2310;&#2346;&#2325;&#2366; &#2344;&#2366;&#2350;</label><input id="otp-name" type="text" placeholder="&#2310;&#2346;&#2325;&#2366; &#2344;&#2366;&#2350;"/></div>
      <button class="btn btn-orange" id="send-btn" onclick="sendOTP()">&#128233; OTP &#2349;&#2375;&#2332;&#2375;&#2306;</button>
      <div class="msg" id="otp-msg1"></div>
    </div>
    <div id="otp-s2" style="display:none">
      <p style="text-align:center;color:#666;font-size:0.83rem;margin-bottom:14px">
        <strong id="sent-to"></strong> &#2346;&#2352; OTP &#2349;&#2375;&#2332;&#2366; &#2327;&#2351;&#2366;
      </p>
      <div class="otp-boxes">
        <input type="tel" maxlength="1" id="ob0" oninput="otpIn(this,0)" onkeydown="otpBack(event,0)"/>
        <input type="tel" maxlength="1" id="ob1" oninput="otpIn(this,1)" onkeydown="otpBack(event,1)"/>
        <input type="tel" maxlength="1" id="ob2" oninput="otpIn(this,2)" onkeydown="otpBack(event,2)"/>
        <input type="tel" maxlength="1" id="ob3" oninput="otpIn(this,3)" onkeydown="otpBack(event,3)"/>
        <input type="tel" maxlength="1" id="ob4" oninput="otpIn(this,4)" onkeydown="otpBack(event,4)"/>
        <input type="tel" maxlength="1" id="ob5" oninput="otpIn(this,5)" onkeydown="otpBack(event,5)"/>
      </div>
      <div class="timer-txt" id="otp-timer"></div>
      <button class="btn btn-blue" onclick="verifyOTP()">&#9989; Verify &#2325;&#2352;&#2375;&#2306;</button>
      <div class="msg" id="otp-msg2"></div>
      <div class="resend"><a id="resend-a" class="off" onclick="resendOTP()">&#128260; &#2342;&#2379;&#2348;&#2366;&#2352;&#2366; OTP &#2349;&#2375;&#2332;&#2375;&#2306;</a></div>
      <div style="text-align:center;margin-top:8px"><a onclick="backPhone()" style="font-size:0.78rem;color:#aaa;cursor:pointer">&#8592; &#2344;&#2306;&#2348;&#2352; &#2348;&#2342;&#2354;&#2375;&#2306;</a></div>
    </div>
  </div>
</div>

<a href="index.html" class="back">&#8592; Website &#2346;&#2352; &#2357;&#2366;&#2346;&#2360; &#2332;&#2366;&#2319;&#2306;</a>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ====================================================
// STEP 1: Firebase config yahan daalen
// Firebase Console > Project Settings > Your apps
// ====================================================
var FB = {
  apiKey:            "PASTE_YOUR_apiKey_HERE",
  authDomain:        "PASTE_YOUR_authDomain_HERE",
  projectId:         "PASTE_YOUR_projectId_HERE",
  storageBucket:     "PASTE_YOUR_storageBucket_HERE",
  messagingSenderId: "PASTE_YOUR_messagingSenderId_HERE",
  appId:             "PASTE_YOUR_appId_HERE"
};

var FB_READY = (FB.apiKey !== "PASTE_YOUR_apiKey_HERE");
var auth;
if (FB_READY) {
  firebase.initializeApp(FB);
  auth = firebase.auth();
  auth.languageCode = 'hi';
}

// Auto redirect if already logged in
(function(){
  try {
    var u = JSON.parse(localStorage.getItem('ssdl_user') || 'null');
    if (u && u.uid) { window.location.href = 'dashboard.html'; }
  } catch(e) { localStorage.removeItem('ssdl_user'); }
})();

// ---- Tab switch ----
function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach(function(b,i){ b.classList.toggle('active',(t==='email'?i===0:i===1)); });
  document.getElementById('p-email').classList.toggle('active', t==='email');
  document.getElementById('p-otp').classList.toggle('active',   t==='otp');
}

// ---- Message helpers ----
function showMsg(id,txt,type){ var el=document.getElementById(id); el.textContent=txt; el.className='msg '+type; }
function hideMsg(id){ document.getElementById(id).className='msg'; }

// ---- Save user & go to dashboard ----
function saveUser(u){
  localStorage.setItem('ssdl_user', JSON.stringify(u));
  window.location.href = 'dashboard.html';
}

// ---- Google Login ----
function googleLogin(){
  if(!FB_READY){ showMsg('e-msg','Firebase config set nahi hai. Admin se contact karen.','err'); return; }
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .then(function(r){
      saveUser({ uid:r.user.uid, name:r.user.displayName, email:r.user.email, photo:r.user.photoURL, method:'google' });
    })
    .catch(function(e){ showMsg('e-msg','Google Login fail: '+e.message,'err'); });
}

// ---- Email Login ----
function emailLogin(){
  var email=document.getElementById('e-email').value.trim();
  var pass=document.getElementById('e-pass').value;
  if(!email||!pass){ showMsg('e-msg','Email aur Password dono darj karen.','err'); return; }
  if(!FB_READY){ showMsg('e-msg','Firebase config set nahi hai.','err'); return; }
  showMsg('e-msg','Login ho raha hai...','info');
  auth.signInWithEmailAndPassword(email,pass)
    .then(function(r){
      saveUser({ uid:r.user.uid, name:r.user.displayName||'Student', email:email, method:'email' });
    })
    .catch(function(e){
      var m={'auth/user-not-found':'Email registered nahi hai.','auth/wrong-password':'Password galat hai.','auth/invalid-email':'Email format galat hai.'};
      showMsg('e-msg', m[e.code]||e.message, 'err');
    });
}

// ---- Email Signup ----
function emailSignup(){
  var name=document.getElementById('e-name').value.trim();
  var email=document.getElementById('e-email').value.trim();
  var pass=document.getElementById('e-pass').value;
  if(!name||!email||!pass){ showMsg('e-msg','Sabhi fields bharen.','err'); return; }
  if(pass.length<6){ showMsg('e-msg','Password kam se kam 6 akshar.','err'); return; }
  if(!FB_READY){ showMsg('e-msg','Firebase config set nahi hai.','err'); return; }
  showMsg('e-msg','Account ban raha hai...','info');
  auth.createUserWithEmailAndPassword(email,pass)
    .then(function(r){
      return r.user.updateProfile({displayName:name}).then(function(){
        saveUser({ uid:r.user.uid, name:name, email:email, method:'email' });
      });
    })
    .catch(function(e){
      var m={'auth/email-already-in-use':'Email pehle se registered hai. Login karen.'};
      showMsg('e-msg', m[e.code]||e.message, 'err');
    });
}

// ====================================================
// OTP LOGIN
// Works without any backend — OTP generated locally
// and sent via 2Factor.in (optional SMS API)
// ====================================================
var _otp, _phone, _name, _timerID;

function gen6(){ return (''+(Math.floor(Math.random()*900000)+100000)); }

function sendOTP(){
  var phone = document.getElementById('otp-phone').value.trim();
  var name  = document.getElementById('otp-name').value.trim() || 'Student';
  if(!/^\d{10}$/.test(phone)){ showMsg('otp-msg1','Sahi 10-digit number darj karen.','err'); return; }

  var btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Bhej rahe hain...';
  hideMsg('otp-msg1');

  _otp   = gen6();
  _phone = phone;
  _name  = name;

  // Store in sessionStorage as backup verify
  sessionStorage.setItem('__otp__'+phone, _otp);

  // Show OTP on screen (works always, no SMS needed)
  // Remove this alert once you add a real SMS API key below
  showMsg('otp-msg1', 'Your OTP: ' + _otp + '  (SMS API not configured yet)', 'info');

  // Uncomment below and add your 2Factor key to send real SMS:
  /*
  var API_KEY = "YOUR_2FACTOR_KEY";
  fetch('https://2factor.in/API/V1/' + API_KEY + '/SMS/91' + phone + '/' + _otp + '/OTP1')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.Status !== 'Success') showMsg('otp-msg1','SMS send nahi hua.','err');
    }).catch(function(){ showMsg('otp-msg1','SMS service error.','err'); });
  */

  document.getElementById('sent-to').textContent = '+91 ' + phone.substring(0,5) + 'XXXXX';
  document.getElementById('otp-s1').style.display = 'none';
  document.getElementById('otp-s2').style.display = 'block';
  document.getElementById('ob0').focus();
  startTimer(120);
}

function otpIn(el, i){
  el.value = el.value.replace(/\D/g,'');
  if(el.value && i < 5) document.getElementById('ob'+(i+1)).focus();
  if(i === 5 && el.value) setTimeout(verifyOTP, 200);
}
function otpBack(e, i){
  if(e.key==='Backspace' && !document.getElementById('ob'+i).value && i>0)
    document.getElementById('ob'+(i-1)).focus();
}
function getOTP(){ return [0,1,2,3,4,5].map(function(i){ return document.getElementById('ob'+i).value; }).join(''); }

function verifyOTP(){
  var entered = getOTP();
  if(entered.length < 6){ showMsg('otp-msg2','6 digit OTP darj karen.','err'); return; }
  var stored = sessionStorage.getItem('__otp__'+_phone) || _otp;
  if(entered === stored){
    clearInterval(_timerID);
    sessionStorage.removeItem('__otp__'+_phone);
    showMsg('otp-msg2','OTP sahi hai! Login ho raha hai...','ok');
    setTimeout(function(){
      saveUser({ uid:'ph_'+_phone, name:_name, phone:'+91'+_phone, method:'otp' });
    }, 800);
  } else {
    showMsg('otp-msg2','OTP galat hai. Dobara check karen.','err');
    [0,1,2,3,4,5].forEach(function(i){ document.getElementById('ob'+i).value=''; });
    document.getElementById('ob0').focus();
  }
}

function startTimer(sec){
  clearInterval(_timerID);
  var el = document.getElementById('otp-timer');
  var ra = document.getElementById('resend-a');
  ra.className = 'off';
  var t = sec;
  _timerID = setInterval(function(){
    var m=Math.floor(t/60), s=t%60;
    el.textContent = m+':'+(s<10?'0'+s:s)+' mein expire hoga';
    t--;
    if(t < 0){ clearInterval(_timerID); el.textContent='OTP expire ho gaya.'; ra.className=''; }
  }, 1000);
}

function resendOTP(){ backPhone(); }
function backPhone(){
  clearInterval(_timerID);
  document.getElementById('otp-s1').style.display = 'block';
  document.getElementById('otp-s2').style.display = 'none';
  document.getElementById('send-btn').disabled = false;
  document.getElementById('send-btn').textContent = 'OTP Bhejen';
  [0,1,2,3,4,5].forEach(function(i){ document.getElementById('ob'+i).value=''; });
  hideMsg('otp-msg1'); hideMsg('otp-msg2');
}
</script>
</body>
</html>
